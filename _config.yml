# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# 사이트 언어 (한국어 레이아웃 적용)
lang: ko

# 시간대
timezone: Asia/Seoul

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Kate의 학습 기록 # 블로그 제목

tagline: AI를 공부하며 배운 것을 기록합니다 # 부제

description: >- # SEO 메타 태그와 피드에 사용됨
  AI와 자연어처리를 공부하며 이해한 내용, 막혔던 지점과 해결 과정을 기록하는 블로그입니다.

# 사이트 주소 (끝에 '/' 없이)
url: "https://ctaleez51-art.github.io"

github:
  username: ctaleez51-art

twitter:
  username:

social:
  # 글의 기본 작성자, 푸터 저작권 표기에 사용됨
  name: 이지연
  email: ctaleez51@gmail.com
  fediverse_handle:
  links:
    # 첫 번째 항목이 저작권 표기 링크로 사용됨
    - https://github.com/ctaleez51-art

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# 색상 테마. 비워두면 방문자의 시스템 설정을 따르고 좌하단에 전환 버튼이 생김
theme_mode: # [light | dark]

# 미디어 리소스용 CDN 주소
cdn:

# 사이드바 프로필 사진 (assets 폴더에 이미지를 넣고 경로를 적으면 표시됨)
avatar:

# SEO og:image 에 쓰이는 대표 이미지
social_preview_image:

# 글 목차(TOC) 전역 스위치
toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  # 댓글 시스템. 비워두면 비활성화
  provider: # [disqus | utterances | giscus]
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# 저장소 이름이 사용자명.github.io 가 아니므로 하위 경로가 필요함
baseurl: "/blog_kate"

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
